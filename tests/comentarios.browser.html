 add('2026-09').click();fill('Outro rascunho');filters=[{'Mês':'2026-10'}];renderComentarios();assert($('comentarioEditor').textContent.includes('2026-09'),'Filtro não muda período do rascunho');assert($('comentarioTexto').value==='Outro rascunho','Filtro preserva texto');
 mode='error';document.querySelector('.del-comentario-btn').click();await settle();assert(getComentariosConfirmados().length===1,'Exclusão falha mantém lista');mode='lost';document.querySelector('.del-comentario-btn').click();await settle();assert(rows.size===0&&getComentariosConfirmados().length===1,'Exclusão sem resposta não vira sucesso');mode='ok';$('comentariosAtualizar').click();await settle();assert(getComentariosConfirmados().length===0,'Consulta reconcilia exclusão');assert($('comentarioTexto').value==='Outro rascunho','Exclusão preserva outra edição');

 $('testResult').textContent='PASS: reabertura, filtro, quota, fechamento, RLS, clique duplo, resposta perdida, UUID, confirmação e exclusão; servidor simulado.';
})().catch(error=>{document.getElementById('testResult').textContent='FAIL: '+error.message;console.error(error);});
