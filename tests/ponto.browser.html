<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Teste de integração — Ponto</title><link rel="stylesheet" href="../static/ponto.css"><body data-role="admin"><button data-tab="ponto">Auditoria</button><div id="pontoRoot"></div><pre id="testResult">RUNNING</pre>
<script>

let imported = null, stored = [], storedJustifications = [], uploadCount = 0, savedEmployee = null;
function query(table) {
  let filters = {}, single = false;
  const q = { select(){return q}, order(){return q}, limit(){return q}, eq(k,v){filters[k]=v;return q}, maybeSingle(){single=true;return q}, single(){single=true;return q}, then(resolve,reject){
    let data = table==='ponto_colaboradores' ? [employee] : table==='ponto_registros' ? stored : table==='ponto_justificativas' ? storedJustifications : imported ? [imported] : [];
    data=data.filter(row=>Object.entries(filters).every(([k,v])=>row[k]===v));
    return Promise.resolve({data:single?(data[0]||null):data,error:null}).then(resolve,reject);
  }}; return q;
}
const sbClient = { auth:{getUser:async()=>({data:{user:{id:'test-owner',app_metadata:{role:'admin'}}}}),onAuthStateChange(){}},from:query,
  storage:{from:()=>{uploadCount++;throw new Error('Storage não pode ser usado na importação')}},
  rpc:async(name,args)=>{if(name==='ponto_salvar_importacao'){imported={...args.p_importacao,data_importacao:new Date().toISOString()};stored=args.p_registros.map((r,i)=>({...r,id:'registro-'+i,importacao_id:imported.id}));storedJustifications=args.p_justificativas.map(j=>({...j,importacao_id:imported.id,registro_ponto_id:stored.find(r=>r.data===j.data).id}));return {data:imported.id,error:null}}savedEmployee=args;return {data:employee.id,error:null}}
};
function getTrustedUserRole(user){return user.app_metadata.role}
</script><script src="../static/ponto-engine.js"></script><script src="../static/ponto.js"></script><script>
function assert(value,message){if(!value)throw new Error(message)}
async function until(fn){for(let i=0;i<300;i++){if(fn())return;await new Promise(r=>setTimeout(r,20))}throw new Error('Tempo excedido: '+fn)}
function makePDF(){
  const text='BT /F1 12 Tf 40 780 Td (Nome: Pessoa de Teste) Tj 0 -30 Td (14/09/2026 Seg 08:01 12:00 13:00 17:38) Tj ET';
  const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${text.length} >>\nstream\n${text}\nendstream`];
  let pdf='%PDF-1.4\n', offsets=[0];objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new File([pdf],'cartao-teste.pdf',{type:'application/pdf'});
}
window.addEventListener('load',async()=>{try{
  const useReal=new URLSearchParams(location.search).has('real');let inputFile;

    let bytes=new Uint8Array(await(await fetch('/__test_pdf_dayane',{cache:'no-store'})).arrayBuffer());

    const pdfjs=await import('../static/vendor/pdfjs/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='/static/vendor/pdfjs/pdf.worker.mjs';const task=pdfjs.getDocument({data:bytes,isEvalSupported:false});
    try{const pdf=await task.promise;let lines=[];for(let p=1;p<=pdf.numPages;p++)lines.push(...PontoEngine.pageLines((await(await pdf.getPage(p)).getTextContent()).items,p));employee.nome=PontoEngine.extract(lines).nome;lines=[]}finally{await task.destroy();if(bytes.byteLength)bytes.fill(0);bytes=null}
  }else inputFile=makePDF();
  onPontoTabActivated();await until(()=>document.getElementById('pontoFile'));
  document.querySelector('[data-view="colaboradores"]').click();document.getElementById('pontoNew').click();
  assert(document.querySelectorAll('[data-day]').length===7,'Cadastro não apresenta sete dias');
  assert(document.getElementById('pontoFixedSchedule').checked,'Novo cadastro sem horário fixo');
  assert(document.querySelector('[name=entrada_11]').disabled,'Horários diários editáveis no modo fixo');

  assert(!document.querySelector('[name=entrada_11]').disabled,'Modo por dia deixou de funcionar');
  document.getElementById('pontoFixedSchedule').checked=true;
  document.getElementById('pontoFixedSchedule').dispatchEvent(new Event('change'));
  ['entrada_1','saida_1','entrada_2','saida_2'].forEach((k,i)=>document.getElementsByName('fixed_'+k)[0].value=['08:00','12:00','13:00','17:36'][i]);
  document.getElementsByName('fixed_expected')[0].value='08:36';
  document.getElementsByName('nome')[0].value='Pessoa de Teste';
  [1,2,3,4,5].forEach(i=>document.getElementsByName('work'+i)[0].checked=true);
  document.getElementById('pontoEmployeeForm').requestSubmit();
  await until(()=>savedEmployee && !document.getElementById('pontoRoot').hasAttribute('aria-busy'));
  assert(savedEmployee.p_jornadas.filter(j=>j.trabalha).length===5,'Dias trabalhados incorretos');
  assert(savedEmployee.p_jornadas.filter(j=>j.trabalha).every(j=>j.entrada_1==='08:00' && j.saida_2==='17:36' && j.minutos_esperados===516),'Horário fixo não aplicado');
  assert(savedEmployee.p_jornadas.filter(j=>!j.trabalha).every(j=>j.minutos_esperados===0),'Folgas receberam jornada');
  document.querySelector('[data-view="importar"]').click();
  const dt=new DataTransfer();dt.items.add(inputFile);const file=document.getElementById('pontoFile');file.files=dt.files;file.dispatchEvent(new Event('change'));dt.items.clear();inputFile=null;
  document.getElementById('pontoStart').value='2026-09-01';document.getElementById('pontoEnd').value='2026-10-03';document.getElementById('pontoImportForm').requestSubmit();
  await until(()=>document.getElementById('pontoAnalyze'));
  assert(document.getElementById('pontoFile').files.length===0,'Arquivo mantido após extração');
  assert(!document.querySelector('#pontoRows .ponto-stats'),'Prévia mostra contagens antes da análise');
  assert(document.getElementById('pontoRows').textContent.includes('Não analisado'),'Prévia não distingue extração e análise');
  assert(document.getElementById('pontoEmployee').value===employee.id,'Nome não associado exatamente');
  ['entrada_1','saida_1','entrada_2','saida_2'].forEach((k,i)=>document.getElementById('pontoMap_'+k).value=i+1);
  document.getElementById('pontoConfirm').checked=true;document.getElementById('pontoAnalyze').click();
  assert(document.getElementById('pontoRows').textContent.includes('REGULAR'),'Resultado não renderizado');
  const exception = document.querySelector('[data-exception]');
  exception.querySelector('[name=enabled]').checked=true;
  exception.querySelector('[name=enabled]').dispatchEvent(new Event('input',{bubbles:true}));
  ['entrada_1','saida_1','entrada_2','saida_2'].forEach((k,i)=>exception.querySelector('[name='+k+']').value=['08:00','12:00','13:00','17:36'][i]);
  exception.querySelector('[name=expected]').value='08:36';
  exception.querySelector('[name=note]').value='Jornada combinada para esta data';
  document.getElementById('pontoTolerance').dispatchEvent(new Event('input'));
  assert(!document.querySelector('#pontoRows .ponto-stats'),'Mudança mantém análise desatualizada');
  document.getElementById('pontoAnalyze').click();
  document.getElementById('pontoSave').click();await until(()=>document.getElementById('pontoResultRows'));
  assert(uploadCount===0,'PDF enviado ao Storage');assert(stored.length===(useReal?33:1),'Quantidade de registros salvos incorreta');assert(stored[0].extraido.tokens[0]==='08:01','Valor original alterado');assert(!('storage_path' in imported),'Caminho de PDF persistido');assert(!document.getElementById('pontoOpenPDF'),'Link de PDF permanece no histórico');
  assert(imported.snapshot.regras.tolerancia_diaria===10,'Snapshot sem regras');
  assert(Object.keys(imported.snapshot.jornadas_excepcionais).length===1,'Exceção aplicada a outras datas');
  assert(stored[0].calculado.jornada_excepcional.observacao==='Jornada combinada para esta data','Exceção ausente do histórico');
  if(useReal){assert(stored.some(r=>r.calculado.classificacao==='REGULAR'),'Todos os dias continuam para conferir após aplicar regras');assert(storedJustifications.length===52,'Justificativas não salvas');assert(imported.snapshot.totais_documento.saldo==='-00:09','Saldo não salvo');assert(document.getElementById('pontoResultRows').textContent.includes('saida diferente'),'Histórico sem justificativas');assert(stored.find(r=>r.data==='2026-09-04').extraido.campos_documento.entrada_2==='13:39*','Alteração sobrescreveu batida original')}
  else assert(stored[0].calculado.classificacao==='REGULAR','Diferença pequena gerou falso positivo');
  document.querySelector('[data-view="importar"]').click();const cancelDt=new DataTransfer();cancelDt.items.add(makePDF());const cancelFile=document.getElementById('pontoFile');cancelFile.files=cancelDt.files;cancelFile.dispatchEvent(new Event('change'));cancelDt.items.clear();document.getElementById('pontoCancelImport').click();assert(document.getElementById('pontoFile').files.length===0,'Cancelamento mantém arquivo');
  const invalidDt=new DataTransfer();invalidDt.items.add(new File(['arquivo inválido'],'invalido.pdf',{type:'application/pdf'}));const invalid=document.getElementById('pontoFile');invalid.files=invalidDt.files;invalid.dispatchEvent(new Event('change'));invalidDt.items.clear();document.getElementById('pontoStart').value='2026-09-01';document.getElementById('pontoEnd').value='2026-10-03';document.getElementById('pontoImportForm').requestSubmit();await until(()=>document.getElementById('pontoNotice').textContent.includes('PDF válido'));assert(document.getElementById('pontoFile').files.length===0,'Erro mantém arquivo');
  await until(()=>!document.getElementById('pontoRoot').hasAttribute('aria-busy'));
  const runningDt=new DataTransfer();runningDt.items.add(makePDF());const running=document.getElementById('pontoFile');running.files=runningDt.files;running.dispatchEvent(new Event('change'));runningDt.items.clear();document.getElementById('pontoImportForm').requestSubmit();assert(!document.getElementById('pontoCancelImport').disabled,'Cancelar indisponível durante processamento');document.getElementById('pontoCancelImport').click();await until(()=>!document.getElementById('pontoRoot').hasAttribute('aria-busy'));assert(document.getElementById('pontoFile').files.length===0,'Cancelamento durante processamento mantém PDF');assert(document.getElementById('pontoPreview').textContent==='','Cancelamento recriou prévia');
  document.getElementById('testResult').textContent='PASS: '+(useReal?'PDF real: 33 dias, 52 justificativas, saldo e histórico estruturado':'PDF sintético, cadastro e regras')+'; sem Storage; descarte após extração, cancelamento e erro';
}catch(e){document.getElementById('testResult').textContent='FAIL: '+e.message;console.error(e)}});
</script></body></html>
